<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudflare Pages 배포 테스트</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 420px;
    }
    h1 { margin-top: 0; font-size: 1.6rem; color: #38bdf8; }
    p { color: #94a3b8; line-height: 1.6; }
    button {
      background: #f97316;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #ea580c; }
    #result { margin-top: 1.5rem; font-weight: bold; color: #4ade80; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Cloudflare Pages 배포 성공</h1>
    <p>GitHub 저장소(jobtoycode/cloudflare)와 연동되어 정상 서빙 중입니다.</p>
    <button onclick="checkStatus()">상태 점검</button>
    <div id="result"></div>
  </div>

  <script>
    function checkStatus() {
      const time = new Date().toLocaleTimeString();
      document.getElementById("result").innerText = `클라이언트 정상 응답: ${time}`;
    }
  </script>
</body>
</html>
